name: Build spdhost Android App

# ضع هذا الملف في: .github/workflows/build-android-app.yml
# يتطلب مجلد مشروع أندرويد باسم android-app/ في المستودع (Gradle, module اسمه app).

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag of Seuj09/Spd_dump_termux to bundle"
        default: "spdhost-exp-spdhost-755211f"
        required: true
      publish:
        description: "Publish the APK as a GitHub release"
        type: boolean
        default: false
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/build-android-app.yml"

permissions:
  contents: write

env:
  UPSTREAM_REPO: Seuj09/Spd_dump_termux
  DEFAULT_TAG: spdhost-exp-spdhost-755211f

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check app project exists
        run: |
          if [ ! -d android-app/app ]; then
            echo "::error::android-app/app not found. Create the Android project first."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Download upstream release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || env.DEFAULT_TAG }}
        run: |
          set -euo pipefail
          mkdir -p upstream && cd upstream
          SHORT="${TAG##*-}"
          gh release download "$TAG" --repo "$UPSTREAM_REPO" \
            --pattern "spdhost-arm64-static-*.zip" \
            --pattern "spdhost-arm32-static-*.zip" \
            --pattern "fdl-pack-*.zip" \
            --pattern "SHA256SUMS"
          ls -la
          # verify each zip against the published SHA256SUMS
          for f in spdhost-arm64-static-*.zip spdhost-arm32-static-*.zip fdl-pack-*.zip; do
            h=$(sha256sum "$f" | cut -d' ' -f1)
            if grep -q "$h" SHA256SUMS; then
              echo "OK  $f"
            else
              echo "::error::checksum mismatch for $f"
              exit 1
            fi
          done

      - name: Lay out native binaries and assets
        run: |
          set -euo pipefail
          cd upstream
          mkdir -p arm64 arm32
          unzip -q -o spdhost-arm64-static-*.zip -d arm64
          unzip -q -o spdhost-arm32-static-*.zip -d arm32

          APP=../android-app/app/src/main
          mkdir -p "$APP/jniLibs/arm64-v8a" "$APP/jniLibs/armeabi-v7a" "$APP/assets"

          pick() { # $1=tree $2=name
            find "$1" -type f -name "$2" ! -path "*/scripts/*" ! -path "*/src/*" | head -n1
          }

          for pair in "arm64:arm64-v8a" "arm32:armeabi-v7a"; do
            tree="${pair%%:*}"; abi="${pair##*:}"
            for bin in spdhost spd_dump; do
              src=$(pick "$tree" "$bin")
              [ -n "$src" ] || { echo "::error::$bin not found in $tree"; exit 1; }
              # Android only extracts lib*.so from jniLibs -> executable from nativeLibraryDir
              cp "$src" "$APP/jniLibs/$abi/lib${bin}.so"
              chmod 755 "$APP/jniLibs/$abi/lib${bin}.so"
              echo "$abi <- $src"
            done
          done

          # loaders (fdl/index + .bin files) and misc BCBs
          cp fdl-pack-*.zip "$APP/assets/fdl-pack.zip"
          misc_dir=$(find arm64 -type d -name misc | head -n1 || true)
          if [ -n "$misc_dir" ]; then
            mkdir -p "$APP/assets/misc" && cp "$misc_dir"/*.bin "$APP/assets/misc/"
          fi

          # record which upstream build was bundled
          echo "${{ inputs.release_tag || env.DEFAULT_TAG }}" > "$APP/assets/upstream-tag.txt"

      - name: Decode keystore (optional)
        id: ks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        working-directory: android-app
        env:
          KEYSTORE_PATH: ${{ steps.ks.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ steps.ks.outputs.signed }}" = "true" ]; then
            gradle --no-daemon assembleRelease
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Collect APKs
        run: |
          mkdir -p out
          find android-app/app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spdhost-app-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Publish release
        if: ${{ inputs.publish == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ github.run_number }}
          name: spdhost app #${{ github.run_number }}
          files: out/*.apk
          prerelease: true
